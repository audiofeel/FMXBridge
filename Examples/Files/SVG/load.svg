       C400 490 350 475 315 450 Z" fill="#16A34A" opacity="0.85"></path>

  <g fill="url(#petal)">
    <ellipse cx="300" cy="180" rx="68" ry="150"></ellipse>
    <ellipse cx="300" cy="420" rx="68" ry="150"></ellipse>
    <ellipse cx="180" cy="300" rx="150" ry="68"></ellipse>
    <ellipse cx="420" cy="300" rx="150" ry="68"></ellipse>

    <ellipse cx="215" cy="215" rx="62" ry="145" transform="rotate(-45 215 215)"></ellipse>
    <ellipse cx="385" cy="215" rx="62" ry="145" transform="rotate(45 385 215)"></ellipse>
    <ellipse cx="215" cy="385" rx="62" ry="145" transform="rotate(45 215 385)"></ellipse>
    <ellipse cx="385" cy="385" rx="62" ry="145" transform="rotate(-45 385 385)"></ellipse>
  </g>

  <circle cx="300" cy="300" r="78" fill="url(#center)"></circle>

  <g fill="#FFF7AE">
    <circle cx="300" cy="245" r="6"></circle>
    <circle cx="330" cy="255" r="6"></circle>
    <circle cx="350" cy="285" r="6"></circle>
    <circle cx="345" cy="320" r="6"></circle>
    <circle cx="325" cy="345" r="6"></circle>
    <circle cx="290" cy="355" r="6"></circle>
    <circle cx="260" cy="340" r="6"></circle>
    <circle cx="250" cy="305" r="6"></circle>
    <circle cx="260" cy="270" r="6"></circle>
