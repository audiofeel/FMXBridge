<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="petal">
      <stop offset="0" stop-color="#FFD6F6"></stop>
      <stop offset="0.55" stop-color="#F472B6"></stop>
      <stop offset="1" stop-color="#BE185D"></stop>
    </radialGradient>

    <radialGradient id="center">
      <stop offset="0" stop-color="#FFF7AE"></stop>
      <stop offset="0.7" stop-color="#F59E0B"></stop>
      <stop offset="1" stop-color="#B45309"></stop>
    </radialGradient>

    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86EFAC"></stop>
      <stop offset="1" stop-color="#15803D"></stop>
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="70" fill="#081C15"></rect>

  <path d="M300 310
       C280 400 260 475 235 550
       C260 560 280 560 300 550
       C325 475 345 400 300 310 Z" fill="url(#stem)"></path>

  <path d="M285 430
